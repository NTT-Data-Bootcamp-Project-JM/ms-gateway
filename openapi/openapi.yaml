openapi: 3.1.0
info:
  title: API gateway
  description: Single entry point. Login and registration are public. Every other
    /api route requires a bearer token and is forwarded through Eureka.
  version: 1.0.0
servers:
- url: http://127.0.0.1:8080
  description: Generated server url
paths:
  /api/v1/auth/{path}:
    get:
      summary: Forwarded to ms-auth
      description: The gateway proxies this call to ms-auth through Eureka.
      responses:
        "200":
          description: Downstream response
    put:
      summary: Forwarded to ms-auth
      description: The gateway proxies this call to ms-auth through Eureka.
      responses:
        "200":
          description: Downstream response
    post:
